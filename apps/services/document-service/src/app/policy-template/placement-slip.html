<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Placement Slip</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 12mm 0;
        font-family: "Helvetica", Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Outer thick orange frame with stepped corners */
      .page-outer {
        position: relative;
        display: inline-block;
        border: 6px solid #ff8c00;
        padding: 5px;
        margin-bottom: 6mm; /* visual gap between pages on screen */
        background: #fff;
      }
      .page-outer::before,
      .page-outer::after {
        content: "";
        position: absolute;
        left: 30px;
        right: 30px;
        height: 6px;
        background: #ff8c00;
      }
      .page-outer::before {
        top: -6px;
      }
      .page-outer::after {
        bottom: -6px;
      }

      /* Inner thin orange line */
      .page {
        width: 210mm;
        height: 297mm;
        padding: 12mm 10mm 6mm;
        background: #fff;
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: inset 0 0 0 2px #ff8c00, 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .page-frame {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0; /* prevent flex overflow issues */
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
        gap: 12px;
        flex: 0 0 auto;
      }

      .page-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        text-decoration: underline;
        margin-bottom: 20px;
        text-align: center;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        overflow: hidden;
      }
      .logo-container img {
        display: block;
        width: auto;
        height: auto;
        object-fit: contain;
      }
      .logo-placeholder {
        width: 130px;
        height: 48px;
        border: 1px dashed #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #777;
        letter-spacing: 2px;
      }

      .insurer-table {
        margin-top: 6px;
        align-self: flex-start;
      }
      .insurer-table table {
        border-collapse: collapse;
        max-width: 100%;
      }
      .insurer-table th,
      .insurer-table td {
        border: 1px solid #444;
        padding: 6px 8px;
        font-size: 11px;
        text-align: left;
        vertical-align: middle;
      }
      .insurer-table th {
        min-width: 120px;
        font-weight: 700;
        background: #f7f3eb;
      }

      .page-body {
        flex: 1 1 auto;
        min-height: 0;
        padding-top: 3mm; /* reduced space for better content flow */
        padding-bottom: 2px;
      }
      .page-body .section:first-child {
        margin-top: 1mm; /* reduced margin for better content flow */
      }

      .section {
        margin-bottom: 12px; /* reduced margin for better space utilization */
        break-inside: auto;
        page-break-inside: auto;
      }

      .section-heading {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 10px;
        text-transform: uppercase;
        break-after: avoid;
        page-break-after: avoid;
      }
      .section p {
        margin: 0 0 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .footer-separator {
        margin-top: 16px;
        border-top: 1px solid #d9a66c;
        flex: 0 0 auto;
      }

      .page-footer {
        margin-top: auto; /* <- pins footer to bottom of the page */
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 10px;
        font-size: 10px;
        min-height: 28px; /* stable footprint so no late reflow */
        flex: 0 0 auto;
      }
      .footer-info {
        max-width: 70%;
      }
      .footer-info div {
        margin-bottom: 4px;
      }
      .footer-organization {
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
      }
      .footer-meta {
        text-align: right;
      }

      /* Horizontal (up-down) table */
      .table-horizontal {
        margin-top: 8px; /* reduced margin for better space utilization */
      }
      .table-horizontal table {
        border-collapse: collapse;
        width: 100%;
      }
      .table-horizontal th,
      .table-horizontal td {
        border: 1px solid #444;
        padding: 10px 12px;
        font-size: 12px;
        vertical-align: top;
      }
      .table-horizontal thead th {
        background: #f7f3eb;
        font-weight: 700;
        text-align: center;
      }

      /* Key/Value (left-right) table */
      .kv-table table {
        border-collapse: collapse;
        width: 100%;
        break-inside: auto; /* Allow table to break across pages */
      }
      .kv-table tr.kv-group-divider td {
        padding: 3px 0;
        border: none;
        height: 4px;
        background: transparent;
      }
      .kv-table th,
      .kv-table td {
        border: 1px solid #444;
        padding: 6px 8px; /* reduced padding for better space utilization */
        font-size: 12px;
        vertical-align: top;
        break-inside: auto; /* Allow cells to break if needed */
      }
      .kv-table th {
        width: 220px;
        background: #f7f3eb;
      }

      .kv-subtable table {
        width: 100%;
        border-collapse: collapse;
      }
      .kv-subtable th,
      .kv-subtable td {
        border: 1px solid #444;
        padding: 6px 8px;
        font-size: 12px;
      }
      .kv-subtable thead th {
        background: #faf7f0;
      }

      /* Letter intro */
      .intro-greeting {
        font-size: 12px;
        margin: 0 0 12px;
      }
      .intro-subject {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 14px;
      }

      .closing-section p {
        font-size: 12px;
        line-height: 1.6;
        margin: 0 0 12px;
      }
      .contact-list {
        margin: 0 0 12px 18px;
        padding: 0;
      }
      .contact-list li {
        margin: 6px 0;
        font-size: 12px;
      }

      .signature-block {
        font-size: 12px;
      }
      .signature-org {
        text-transform: uppercase;
      }
      .signature-authority {
        letter-spacing: 0.3px;
        margin-top: 80px;
      }

      /* Company page headings + spacing between subsections */
      .company-main-title {
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        text-decoration: underline;
        margin: 0 0 8px; /* reduced margin */
      }
      .company-subheading {
        margin: 12px 0 8px; /* reduced margins */
      }
      .company-block {
        margin: 0 0 15px; /* reduced margin */
      }

      /* Warranties note styling */
      .company-warranty-note p {
        font-size: 12px;
        line-height: 1.55;
        margin: 0 0 8px;
      }

      body.paginating .page-body {
        overflow: auto !important;
      }

      @page {
        size: A4;
        margin: 0;
      }

      @page {
        size: A4;
        margin: 0;
      }

      @media print {
        body {
          padding: 0;
          background: #fff;
        }

        .page-outer {
          display: block;
          margin: 0;
          page-break-after: always; /* one sheet per .page-outer */
          border: 5px solid #ff8c00;
          padding: 5px;
        }
        .page-outer:last-child {
          page-break-after: auto;
        }

        .page-outer::before,
        .page-outer::after {
          display: none !important;
        }

        .page {
          width: 205mm;
          height: 292mm;
          overflow: visible !important; /* <-- critical: no clipping in print */
        }

        .page-body {
          overflow: visible !important; /* <-- critical: no clipping in print */
          max-height: none !important; /* undo JS-pinned height for print */
          padding-bottom: 0; /* optional: tighter bottom spacing */
        }

        .section,
        .kv-table table,
        .table-horizontal table {
          page-break-inside: auto;
          break-inside: auto;
        }

        .kv-table tr,
        .table-horizontal tr,
        .kv-table td,
        .kv-table th,
        .table-horizontal td,
        .table-horizontal th {
          page-break-inside: avoid;
          break-inside: avoid;
        }

        thead {
          display: table-header-group;
        }
        tfoot {
          display: table-footer-group;
        }
        tbody {
          display: table-row-group;
        }

        .section-heading {
          break-after: avoid;
          page-break-after: avoid;
          orphans: 2;
          widows: 2;
        }

        .section[data-is-continuation="true"] {
          margin-top: 0;
        }

        .page-break {
          break-before: page;
          page-break-before: always;
        }

        tbody.page2 {
          break-before: page;
          page-break-before: always;
        }
      }

      .nested-table {
        width: 100%;
        border-collapse: collapse;
        margin: 0;
      }

      .nested-table th,
      .nested-table td {
        border: 1px solid #666;
        padding: 4px 6px;
        font-size: 11px;
        vertical-align: top;
      }

      .nested-table th {
        background: #f9f6f0;
        font-weight: 600;
        width: 40%;
      }

      .kv-subtable {
        margin: 0;
        padding: 0;
      }

      .kv-subtable .nested-table {
        border: none;
      }

      .kv-subtable .nested-table th,
      .kv-subtable .nested-table td {
        border: 1px solid #999;
      }
      .section-subheading {
        font-size: 12px;
        margin: -6px 0 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="placement-slip-root" class="container">{{PAGES}}</div>
    <!-- Secure JSON data injection - prevents XSS by using proper JSON encoding -->
    <!-- fd_secret_ignore -->
    <script id="placement-slip-data" type="application/json">{{JSON_SERIALIZED_DATA}}</script>

    <script>
      (function () {
        var debug = (function () {
          var params = new URLSearchParams(window.location.search || "");
          var enabled =
            params.get("ps-debug") === "1" ||
            params.get("debug") === "1" ||
            params.has("ps-debug");

          if (!enabled) {
            try {
              enabled =
                window.localStorage &&
                window.localStorage.getItem("placementSlipDebug") === "1";
            } catch (err) {
              // ignore storage access issues (private mode, etc.)
            }
          }

          var buffer = [];
          var panel = null;
          var rootRef = null;

          // function timestamp() {
          //   // Get current time in IST (UTC+5:30)
          //   const now = new Date();
          //   // IST offset in minutes: 5 hours 30 minutes = 330
          //   const istOffset = 330;
          //   // Convert to milliseconds and add to UTC time
          //   const istTime = new Date(
          //     now.getTime() + (istOffset - now.getTimezoneOffset()) * 60000
          //   );
          //   // Format as ISO string (removing the Z to indicate local time)
          //   return istTime.toISOString().replace("Z", "+05:30");
          // }
          function timestamp() {
            const now = new Date();
            // Convert to IST by adding 5 hours 30 minutes
            const istTime = new Date(now.getTime() + (5 * 60 + 30) * 60000);

            // Use toLocaleString for IST timezone
            return (
              istTime
                .toLocaleString("en-IN", {
                  timeZone: "Asia/Kolkata",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit",
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                  hour12: false,
                })
                .replace(/(\d+)\/(\d+)\/(\d+),/, "$3-$2-$1T")
                .replace(" ", "T") + "+05:30"
            );
          }

          function log() {
            if (!enabled) {
              return;
            }
            var args = Array.prototype.slice.call(arguments);
            buffer.push({ ts: timestamp(), args: args });
            try {
              console.log.apply(console, ["[placement-slip]"].concat(args));
            } catch (_) {}
          }

          function warn() {
            if (!enabled) {
              return;
            }
            var args = Array.prototype.slice.call(arguments);
            buffer.push({ ts: timestamp(), level: "warn", args: args });
            try {
              console.warn.apply(console, ["[placement-slip]"].concat(args));
            } catch (_) {}
          }

          function ensureStyles() {
            if (!enabled || document.getElementById("ps-debug-style")) {
              return;
            }
            var style = document.createElement("style");
            style.id = "ps-debug-style";
            style.textContent =
              ".ps-debug-outline{outline:2px dashed rgba(220,0,0,0.7)!important;position:relative;}" +
              ".ps-debug-outline::after{content:attr(data-ps-debug-flag);position:absolute;top:-12px;right:4px;font:10px/1.2 monospace;color:#fff;background:rgba(220,0,0,0.85);padding:1px 4px;border-radius:2px;}" +
              ".ps-debug-panel{position:fixed;left:12px;bottom:12px;z-index:2147483646;background:rgba(17,17,17,0.9);color:#f5f5f5;font:11px/1.5 monospace;padding:10px 12px;border-radius:6px;max-width:320px;max-height:50vh;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,0.35);}" +
              ".ps-debug-panel h2{margin:0 0 6px;font-size:12px;font-weight:700;}" +
              ".ps-debug-panel ul{margin:0;padding-left:16px;}" +
              ".ps-debug-panel button{margin-top:8px;padding:4px 8px;font-size:10px;cursor:pointer;}";
            document.head.appendChild(style);
          }

          function ensurePanel() {
            if (!enabled) {
              return null;
            }
            ensureStyles();
            if (panel && document.body.contains(panel)) {
              return panel;
            }
            panel = document.createElement("div");
            panel.className = "ps-debug-panel";
            panel.innerHTML =
              '<h2>Placement Slip Debug</h2><div class="ps-debug-summary"></div>';
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "Copy snapshot";
            btn.addEventListener("click", function () {
              try {
                var snapshot = JSON.stringify(getSnapshot(), null, 2);
                if (!navigator.clipboard || !navigator.clipboard.writeText) {
                  throw new Error("Clipboard API unavailable");
                }
                navigator.clipboard.writeText(snapshot).then(
                  function () {
                    btn.textContent = "Copied!";
                    setTimeout(function () {
                      btn.textContent = "Copy snapshot";
                    }, 1500);
                  },
                  function () {
                    btn.textContent = "Copy failed";
                    setTimeout(function () {
                      btn.textContent = "Copy snapshot";
                    }, 2000);
                  }
                );
              } catch (err) {
                warn("Failed to copy snapshot", err);
              }
            });
            panel.appendChild(btn);
            document.body.appendChild(panel);
            return panel;
          }

          function summarisePages() {
            if (!rootRef) {
              return [];
            }
            var pages = Array.from(rootRef.querySelectorAll(".page"));
            return pages.map(function (page, index) {
              var body = page.querySelector(".page-body");
              if (!body) {
                return { index: index, missingBody: true };
              }
              var scroll = Math.ceil(body.scrollHeight);
              var client = Math.floor(body.clientHeight);
              var overflow = scroll - client;
              return {
                index: index,
                scrollHeight: scroll,
                clientHeight: client,
                overflow: overflow,
                sections: body.querySelectorAll(".section").length,
              };
            });
          }

          function renderSummary(context) {
            if (!enabled) {
              return;
            }
            var host = ensurePanel();
            if (!host) {
              return;
            }
            var container = host.querySelector(".ps-debug-summary");
            if (!container) {
              return;
            }
            var pages = summarisePages();
            var lines =
              "Context: " +
              context +
              "\n" +
              pages
                .map(function (p) {
                  return (
                    "p" +
                    (p.index + 1) +
                    ": scroll=" +
                    p.scrollHeight +
                    " client=" +
                    p.clientHeight +
                    " overflow=" +
                    p.overflow +
                    " sections=" +
                    p.sections
                  );
                })
                .join("\n");
            container.textContent = lines;
          }

          function mark(el, label) {
            if (!enabled || !el) {
              return;
            }
            ensureStyles();
            try {
              el.classList.add("ps-debug-outline");
              el.setAttribute("data-ps-debug-flag", label || "flag");
            } catch (_) {}
          }

          function getSnapshot() {
            return {
              ts: timestamp(),
              pages: summarisePages(),
              log: buffer.slice(-120),
            };
          }

          return {
            enabled: enabled,
            log: log,
            warn: warn,
            mark: mark,
            renderSummary: renderSummary,
            setRoot: function (el) {
              rootRef = el;
            },
            getSnapshot: getSnapshot,
            buffer: buffer,
          };
        })();

        window.__PLACEMENT_SLIP_DEBUG__ = debug;

        async function waitForStableLayout(rootEl) {
          // wait for images
          const pendingImgs = Array.from(document.images).filter(
            (img) => !img.complete
          );
          if (pendingImgs.length) {
            await Promise.all(
              pendingImgs.map(
                (img) =>
                  new Promise((res) => {
                    img.addEventListener("load", res, { once: true });
                    img.addEventListener("error", res, { once: true });
                  })
              )
            );
          }
          // wait for fonts
          if (document.fonts && document.fonts.ready) {
            try {
              await document.fonts.ready;
            } catch (_) {}
          }
          // flush layout
          await new Promise((r) =>
            requestAnimationFrame(() => requestAnimationFrame(r))
          );
        }
        // ---- ERROR OVERLAY (diagnostic) ----
        function showHardError(err) {
          try {
            var msg =
              err && (err.stack || err.message)
                ? err.stack || err.message
                : String(err);
            var banner = document.createElement("pre");
            banner.style.cssText =
              "white-space:pre-wrap; font:12px/1.4 monospace; color:#b00020; background:#fff3f4; border:1px solid #b00020; padding:12px; margin:8px 0;";
            banner.textContent = "Placement Slip: Runtime error\n\n" + msg;
            var host =
              document.getElementById("placement-slip-root") || document.body;
            host.innerHTML = "";
            host.appendChild(banner);
          } catch (_) {}
        }
        window.addEventListener("error", function (e) {
          showHardError(e.error || e.message);
        });
        window.addEventListener("unhandledrejection", function (e) {
          showHardError(e.reason || e);
        });
        // ------------------------------------

        // Input validation following coding standards
        const validateData = (data) => {
          if (!data || typeof data !== "object") {
            throw new Error("Export data is required and must be an object");
          }
        };

        const validatePayload = (payload) => {
          if (!payload || typeof payload !== "object") {
            throw new Error("Payload is required and must be an object");
          }
        };

        var DEFAULT_LOGO_RELATIVE_PATH = "../jpgs/iirm_india_logo.jpg";

        var root = document.getElementById("placement-slip-root");
        if (!root) {
          console.error("placement-slip-root element not found");
          return;
        }

        debug.setRoot(root);
        debug.log("Debugging enabled?", debug.enabled);

        var dataScript = document.getElementById("placement-slip-data");
        var exportData;

        if (dataScript) {
          var raw = (dataScript.textContent || "").trim();
          if (raw && raw.indexOf("{{JSON_SERIALIZED_DATA}}") === -1) {
            try {
              exportData = JSON.parse(raw);
              validateData(exportData);
            } catch (e) {
              console.error("Failed to parse placement slip data:", e);
              exportData = null;
            }
          }
        }

        if (!exportData) {
          exportData = getSampleExportData();
          if (dataScript) {
            dataScript.textContent = JSON.stringify(exportData, null, 2);
          }
        }

        // Handle the new data structure from your API response
        if (exportData.data) {
          exportData = {
            payload: buildPayloadFromApiResponse(exportData),
            assets: exportData.assets || {
              logo: { path: DEFAULT_LOGO_RELATIVE_PATH },
            },
          };
        } else if (!exportData.payload) {
          exportData = {
            payload: buildPayloadFromNewSchema(exportData),
            assets: exportData.assets || {
              logo: { path: DEFAULT_LOGO_RELATIVE_PATH },
            },
          };
        }

        var payload = normalizePayload(exportData.payload);
        validatePayload(payload);

        var printedOnLabel = formatPrintedOnLabel(payload.printedOn);
        var logoHtml = createLogoHtml(exportData.assets, payload);

        var pagesHtml = payload.pages
          .map(function (page, index) {
            return renderPage({
              page: page,
              pageIndex: index,
              totalPages: payload.pages.length,
              payload: payload,
              logoHtml: logoHtml,
              printedOnLabel: printedOnLabel,
            });
          })
          .join("");

        root.innerHTML = pagesHtml;

        function lockPageBodyHeights() {
          const pages = root.querySelectorAll(".page");
          const metrics = debug.enabled ? [] : null;
          pages.forEach((page, pageIndex) => {
            const title = page.querySelector(".page-title");
            const header = page.querySelector(".page-header");
            const body = page.querySelector(".page-body");
            const sep = page.querySelector(".footer-separator");
            const footer = page.querySelector(".page-footer");
            if (!body || !header || !footer) return;

            // Fixed A4 page box height
            const totalH = Math.round(page.getBoundingClientRect().height);

            // Title box (height + margins)
            let titleH = 0,
              titleGapT = 0,
              titleGapB = 0;
            if (title) {
              const tRect = title.getBoundingClientRect();
              const tCS = getComputedStyle(title);
              titleH = Math.ceil(tRect.height);
              titleGapT = parseFloat(tCS.marginTop) || 0;
              titleGapB = parseFloat(tCS.marginBottom) || 0;
            }

            // Header / footer
            const headH = Math.ceil(header.getBoundingClientRect().height);
            const footH = Math.ceil(footer.getBoundingClientRect().height);

            // Separator height + margins
            let sepH = 0;
            if (sep) {
              const sRect = sep.getBoundingClientRect();
              const sCS = getComputedStyle(sep);
              sepH =
                Math.ceil(sRect.height) +
                (parseFloat(sCS.marginTop) || 0) +
                (parseFloat(sCS.marginBottom) || 0);
            }

            // Header/footer margins relative to body
            const headerCS = getComputedStyle(header);
            const footerCS = getComputedStyle(footer);
            const headGapB = parseFloat(headerCS.marginBottom) || 0;
            const footGapT = parseFloat(footerCS.marginTop) || 0;

            // Body paddings/borders (content-box math)
            const cs = getComputedStyle(body);
            const padTop = parseFloat(cs.paddingTop) || 0;
            const padBot = parseFloat(cs.paddingBottom) || 0;
            const borderT = parseFloat(cs.borderTopWidth) || 0;
            const borderB = parseFloat(cs.borderBottomWidth) || 0;

            // Max box height for .page-body (border-box), subtracting the title too
            const bodyBoxMax =
              totalH -
              (titleH + titleGapT + titleGapB) -
              headH -
              headGapB -
              sepH -
              footGapT -
              footH;

            // Convert to content-box (what scrollHeight compares against)
            const contentBudget =
              bodyBoxMax - padTop - padBot - borderT - borderB;

            const maxHeight = Math.max(0, Math.floor(contentBudget));
            body.style.maxHeight = maxHeight + "px";

            if (metrics) {
              metrics.push({
                page: pageIndex + 1,
                totalHeight: totalH,
                bodyBudget: maxHeight,
                sections: body.querySelectorAll(".section").length,
              });
            }
          });

          if (metrics) {
            debug.log("lockPageBodyHeights budgets", metrics);
            debug.renderSummary("lockPageBodyHeights");
          }
        }

        // Use requestAnimationFrame for better timing
        // Run pagination after layout (images/fonts) are ready
        (async function runPagination() {
          try {
            await waitForStableLayout(root);
            debug.log("runPagination: layout settled");
            debug.renderSummary("post-layout");

            // NEW: pin body heights before any pagination pass
            lockPageBodyHeights();
            debug.renderSummary("after-initial-lock");
            const originalContent = root.innerHTML;
            const originalSectionCount =
              root.querySelectorAll(".section").length || 0;

            document.body.classList.add("paginating");

            paginateContentImproved();
            debug.renderSummary("after-paginateContentImproved");

            // After pagination created new pages, re-pin heights once (new pages need sizing too)
            lockPageBodyHeights();
            debug.renderSummary("after-second-lock");

            if (typeof finalSettle === "function") {
              finalSettle();
            }

            debug.renderSummary("after-finalSettle");

            const finalSectionCount =
              root.querySelectorAll(".section").length || 0;
            if (finalSectionCount < originalSectionCount) {
              root.innerHTML = originalContent;
              // Ensure heights are pinned for fallback too
              lockPageBodyHeights();
              paginateSimple();
            }

            updatePageNumbers();
            debug.renderSummary("after-updatePageNumbers");
            document.body.setAttribute("data-render-complete", "true");
          } catch (error) {
            showHardError(error);
            document.body.setAttribute("data-render-complete", "true");
          } finally {
            document.body.classList.remove("paginating");
          }
        })();

        // Fallback simple pagination that only moves complete sections
        function paginateSimple() {
          var pages = root.querySelectorAll(".page");
          if (debug.enabled) {
            debug.log("paginateSimple invoked", { pageCount: pages.length });
          }

          for (var i = 0; i < pages.length; i++) {
            var currentPage = pages[i];
            var pageBody = currentPage.querySelector(".page-body");
            if (!pageBody) continue;

            var attempts = 0;
            while (isPageOverflowing(pageBody) && attempts < 5) {
              var sections = pageBody.querySelectorAll(".section");
              if (sections.length <= 1) break;

              var lastSection = sections[sections.length - 1];
              var nextPage = getOrCreateNextPage(currentPage);
              if (!nextPage) {
                if (debug.enabled) {
                  debug.warn("paginateSimple: unable to create next page", {
                    page: i + 1,
                  });
                }
                break;
              }

              var nextPageBody = nextPage.querySelector(".page-body");
              if (!nextPageBody) {
                if (debug.enabled) {
                  debug.warn("paginateSimple: next page missing body", {
                    page: i + 1,
                  });
                }
                break;
              }

              nextPageBody.appendChild(lastSection);
              if (debug.enabled) {
                var idx = Array.prototype.indexOf.call(pages, nextPage);
                debug.log("paginateSimple: moved section", {
                  fromPage: i + 1,
                  toPage: idx >= 0 ? idx + 1 : "?",
                  sectionId:
                    lastSection.getAttribute("data-section-key") || null,
                });
              }
              attempts++;
              pages = Array.from(root.querySelectorAll(".page"));
            }
          }

          pruneEmptyPages();
          updatePageNumbers();
          if (debug.enabled) {
            debug.renderSummary("after-paginateSimple");
          }
          document.body.setAttribute("data-render-complete", "true");
        }

        /* ====================== API Response Handler ====================== */
        function buildPayloadFromApiResponse(apiData) {

        /* ====================== FIXED Company Pages Renderer ====================== */
        function renderCompanyPages(blocksRaw) {
          if (!blocksRaw || typeof blocksRaw !== "object") {
            return "<p>No company data available</p>";
          }

          var blocks = blocksRaw;
          var html = "";

          // Build main title (if present) to prepend into the FIRST company
          // section, so the title and that section paginate as one unit. Keeping
          // it as its own .section let the paginator orphan it on a blank page
          // whenever the following section was too tall to fit beneath it.
          var titlePrefix = "";
          if (
            blocks.CompanyPolicyDetails &&
            (blocks.CompanyPolicyDetails.heading ||
              blocks.CompanyPolicyDetails.Heading)
          ) {
            var title =
              blocks.CompanyPolicyDetails.heading ||
              blocks.CompanyPolicyDetails.Heading;
            titlePrefix =
              '<div class="company-main-title">' +
              escapeHtml(title) +
              "</div>";
          }

          // Get only company-* blocks and sort in our explicit order
          var orderedKeys = Object.keys(blocks).filter(isCompanyKey);

          var labelIndex = 0;
          orderedKeys.forEach(function (key) {
            var raw = blocks[key];
            if (!raw) return;
            html += renderCompanySection(
              raw,
              labelIndex++,
              key,
              blocks,
              labelIndex === 1 ? titlePrefix : ""
            );
          });

          return html;
        }

        /* ====================== NEW: Render Complete Company Section ====================== */
        function renderCompanySection(raw, labelIndex, key, allBlocks, prefixHtml) {
          var b = normalizeBlock(raw);
          var html = "";

          // styling flags
          var titleStyle =
            (b.bold ? "font-weight:700;" : "") +
            (b.underline ? "text-decoration:underline;" : "");

          // Decide what to show as the main title
          var fallbackTitle = key
            .replace(/^Company/, "")
            .replace(/([A-Z])/g, " $1")
            .trim();
          var hasHeading = !!(b.heading && String(b.heading).trim());
          var hasSub = !!(b.subHeading && String(b.subHeading).trim());
          var subHeadingText = hasSub ? String(b.subHeading).trim() : "";

          // Special-case Section A so we don't repeat the big page title:
          // Use subHeading ("POLICY DETAILS") as the section title if present.
          var mainTitle;
          if (key === "CompanyPolicyDetails") {
            mainTitle = hasSub
              ? subHeadingText
              : hasHeading
              ? String(b.heading).trim()
              : fallbackTitle;
            // if we used subHeading as mainTitle, suppress printing it again below
            if (hasSub && sameText(mainTitle, b.subHeading)) hasSub = false;
          } else {
            // normal sections: heading if present, otherwise fallback
            if (hasHeading) {
              mainTitle = String(b.heading).trim();
            } else if (hasSub) {
              mainTitle = subHeadingText;
              hasSub = false;
            } else {
              mainTitle = fallbackTitle;
            }
          }

          html +=
            '<div class="section" data-section-key="' + escapeHtml(key) + '">';

          // Page title prepended into the first section (see renderCompanyPages)
          if (prefixHtml) {
            html += prefixHtml;
          }

          // Main heading line
          if (mainTitle) {
            html +=
              '<h2 class="section-heading company-subheading" style="' +
              titleStyle +
              '">' +
              alphaLabel(labelIndex) +
              " " +
              escapeHtml(mainTitle) +
              (/:$/.test(mainTitle) ? "" : ":") +
              "</h2>";
          }

          // (Removed) subheading rendering to avoid duplicates
          // if (hasSub && !sameText(b.subHeading, mainTitle)) { ... }

          // Warranties preface (unchanged)
          if (key === "CompanyWarranties") {
            html += renderWarrantyNote(allBlocks);
          }

          // Body
          html +=
            '<div class="company-block">' + renderSectionContent(b) + "</div>";

          // Close
          html += "</div>";
          return html;

        /* ====================== FIXED Section Content Renderer ====================== */
        function renderSectionContent(block) {
          if (!block || !block.rows || !block.rows.length) {
            return "<p>No data available</p>";
          }

          if (block.type === "table") {
            if (block.tableType === "up-down") {
              return renderHorizontalTable(block.rows);
            } else {
              return renderKeyValueTable(block.rows);
            }
          }

          return renderTextContent(block);
        }

        /* ====================== FIXED Key-Value Table Renderer ====================== */
        function renderKeyValueTable(rows) {
          if (!Array.isArray(rows) || !rows.length) {
            return '<div class="kv-table"><table><tbody><tr><th>No Data</th><td>No Data Available</td></tr></tbody></table></div>';
          }

          var tableRows = rows
            .map(function (row, rowIndex) {
              if (!row || typeof row !== "object") {
                return renderKeyValueRow("Value", row);
              }

              var keys = Object.keys(row || {});
              if (!keys.length) {
                return "";
              }

              var groupRows = keys
                .map(function (key) {
                  var value = row[key];
                  return renderKeyValueRow(key, value);
                })
                .join("");

              if (!groupRows) {
                return "";
              }

              if (rowIndex > 0) {
                groupRows =
                  '<tr class="kv-group-divider" aria-hidden="true"><td colspan="2"></td></tr>' +
                  groupRows;
              }

              return groupRows;
            })
            .filter(Boolean)
            .join("");

          if (!tableRows) {
            return '<div class="kv-table"><table><tbody><tr><th>No Data</th><td>No Data Available</td></tr></tbody></table></div>';
          }

          return (
            '<div class="kv-table"><table><tbody>' +
            tableRows +
            "</tbody></table></div>"
          );
        }

        /* ====================== FIXED Key-Value Row Renderer ====================== */
        function renderKeyValueRow(key, value) {
          if (!key?.trim()) {
            return "";
          }

          var cellContent = "";

          if (value === null || value === undefined) {
            cellContent = "NA";
          } else if (isNestedTableData(value)) {
            cellContent =
              '<div class="kv-subtable">' + renderNestedTable(value) + "</div>";
          } else if (typeof value === "object") {
            // Handle object values that aren't tables - convert to readable format
            try {
              cellContent = Object.keys(value)
                .map(function (k) {
                  return escapeHtml(k) + ": " + escapeHtml(String(value[k]));
                })
                .join("<br>");
            } catch (e) {
              cellContent = escapeHtml(JSON.stringify(value));
            }
          } else {
            cellContent = escapeHtml(String(value));
          }

          return (
            "<tr><th>" +
            escapeHtml(key) +
            "</th><td>" +
            cellContent +
            "</td></tr>"
          );
        }

        /* ====================== FIXED Nested Table Detection ====================== */
        function isNestedTableData(value) {
          if (!value || typeof value !== "object") {
            return false;
          }

          return (
            value.dataType === "table" ||
            value.Type === "table" ||
            (value.sectionData && Array.isArray(value.sectionData))
          );
        }

        /* ====================== FIXED Nested Table Renderer ====================== */
        function renderNestedTable(tableData) {
          if (!tableData) {
            return '<table class="nested-table"><tbody><tr><td>No data</td></tr></tbody></table>';
          }

          var normalizedData = normalizeBlock(tableData);

          if (normalizedData.type === "table") {
            if (normalizedData.tableType === "up-down") {
              return renderHorizontalTable(normalizedData.rows);
            } else {
              return renderSimpleNestedTable(normalizedData.rows);
            }
          }

          return renderTextContent(normalizedData);
        }

        /* ====================== FIXED Simple Nested Table Renderer ====================== */
        function renderSimpleNestedTable(rows) {
          if (!Array.isArray(rows) || !rows.length) {
            return '<table class="nested-table"><tbody><tr><td colspan="2">No data</td></tr></tbody></table>';
          }

          var obj = rows[0] || {};
          var keys = Object.keys(obj);

          if (!keys.length) {
            return '<table class="nested-table"><tbody><tr><td colspan="2">No data</td></tr></tbody></table>';
          }

          var tableRows = keys
            .map(function (key) {
              var value = obj[key];
              var displayValue =
                value === null || value === undefined ? "NA" : String(value);
              return (
                "<tr><th>" +
                escapeHtml(key) +
                "</th><td>" +
                escapeHtml(displayValue) +
                "</td></tr>"
              );
            })
            .join("");

          return (
            '<table class="nested-table"><tbody>' +
            tableRows +
            "</tbody></table>"
          );
        }

        /* ====================== FIXED Horizontal Table Renderer ====================== */
        function renderHorizontalTable(rows, preferredOrder) {
          if (!Array.isArray(rows) || !rows.length) {
            return '<div class="table-horizontal"><table><thead><tr><th>Description</th><th>Remarks</th></tr></thead><tbody><tr><td>No data</td><td>No data</td></tr></tbody></table></div>';
          }

          var first = rows[0] || {};
          var headers =
            Array.isArray(preferredOrder) && preferredOrder.length
              ? preferredOrder
              : Object.keys(first);

          if (!headers.length) {
            headers = ["Description", "Remarks"];
          }

          var thead =
            "<thead><tr>" +
            headers
              .map(function (h) {
                return "<th>" + escapeHtml(h) + "</th>";
              })
              .join("") +
            "</tr></thead>";

          var tbody =
            "<tbody>" +
            rows
              .map(function (row) {
                // Split each cell into page-friendly chunks. Cells within the
                // limit return a single chunk, so non-oversized rows render
                // exactly as before (one <tr> with identical content). Only an
                // over-long cell expands into extra rows the paginator can break
                // across pages.
                var cellChunks = headers.map(function (header) {
                  var cellValue = row[header];
                  var displayValue =
                    cellValue === null || cellValue === undefined
                      ? ""
                      : String(cellValue);
                  return splitLongCellValue(displayValue);
                });

                var rowSpan = cellChunks.reduce(function (max, chunks) {
                  return Math.max(max, chunks.length);
                }, 1);

                var trs = [];
                for (var part = 0; part < rowSpan; part++) {
                  trs.push(
                    "<tr>" +
                      cellChunks
                        .map(function (chunks) {
                          var value = part < chunks.length ? chunks[part] : "";
                          return "<td>" + escapeHtml(value) + "</td>";
                        })
                        .join("") +
                      "</tr>"
                  );
                }

                return trs.join("");
              })
              .join("") +
            "</tbody>";

          return (
            '<div class="table-horizontal"><table>' +
            thead +
            tbody +
            "</table></div>"
          );
        }

        /* ====================== Long Cell Splitter ======================
           Splits an over-long cell value into page-friendly chunks on newline
           boundaries so a single huge row (e.g. Terms & Conditions) can be
           paginated. Values within MAX_CHARS are returned as a single chunk, so
           normal-sized cells render unchanged. */
        function splitLongCellValue(text) {
          var MAX_CHARS = 1200;
          if (!text || text.length <= MAX_CHARS) {
            return [text || ""];
          }

          var segments = String(text).split("\n");
          var chunks = [];
          var current = "";

          segments.forEach(function (segment) {
            var candidate = current ? current + "\n" + segment : segment;
            if (candidate.length > MAX_CHARS && current) {
              chunks.push(current);
              current = segment;
            } else {
              current = candidate;
            }
          });

          if (current) {
            chunks.push(current);
          }

          return chunks.length ? chunks : [String(text)];
        }

        /* ====================== FIXED Text Content Renderer ====================== */
        function renderTextContent(block) {
          if (!block || !block.rows || !block.rows.length) {
            return "<p>No content available</p>";
          }

          var baseStyle =
            (block.bold ? "font-weight:700;" : "") +
            (block.underline ? "text-decoration:underline;" : "");

          return block.rows
            .map(function (row) {
              var keys = Object.keys(row);
              if (!keys.length) {
                return '<p style="' + baseStyle + '">&nbsp;</p>';
              }

              return keys
                .map(function (key) {
                  var value = row[key];
                  var displayValue =
                    value === null || value === undefined ? "" : String(value);
                  return (
                    '<p style="' +
                    baseStyle +
                    '">' +
                    '<span style="font-weight:700">' +
                    escapeHtml(key) +
                    ":</span> " +
                    escapeHtml(displayValue) +
                    "</p>"
                  );
                })
                .join("");
            })
            .join("");
        }

        function ensureKvContinuationShell(currentPage, section, sourceTable) {
          const kvSubtable = sourceTable.closest(".kv-subtable");
          if (!kvSubtable) return null;

          const mode = sourceTable.classList.contains("nested-table")
            ? "nested"
            : sourceTable.closest(".table-horizontal")
            ? "horizontal"
            : null;
          if (!mode) {
            return null;
          }

          const nextPage = getOrCreateNextPage(currentPage);
          if (!nextPage) return null;

          const nextPageBody = nextPage.querySelector(".page-body");
          if (!nextPageBody) return null;

          const kvRow = sourceTable.closest("tr");
          const kvTh = kvRow ? kvRow.querySelector("th") : null;
          const kvLabel = kvTh ? kvTh.textContent.trim() : "";
          const continuationLabel = kvLabel
            ? /\bcont\.?/i.test(kvLabel)
              ? kvLabel
              : kvLabel + " (Contd.)"
            : "";
          const labelText = continuationLabel || kvLabel || "";

          const expectedSelector =
            mode === "nested"
              ? ".kv-subtable .nested-table tbody"
              : ".kv-subtable .table-horizontal table tbody";

          const existing = Array.from(
            nextPageBody.querySelectorAll(
              '.section[data-is-continuation="true"]'
            )
          ).find(function (sec) {
            if (sec.getAttribute("data-cont-label") !== labelText) {
              return false;
            }
            return !!sec.querySelector(expectedSelector);
          });

          if (existing) {
            const contBody = existing.querySelector(expectedSelector);
            const contTable = contBody ? contBody.closest("table") : null;
            if (contBody && contTable) {
              return {
                nextPageBody,
                contSection: existing,
                contBody,
                contTable,
                mode,
              };
            }
          }

          const contSection = document.createElement("div");
          contSection.className = "section";
          contSection.setAttribute("data-is-continuation", "true");
          contSection.setAttribute("data-cont-label", labelText);

          const kvTableWrap = document.createElement("div");
          kvTableWrap.className = "kv-table";

          const outerTable = document.createElement("table");
          const outerBody = document.createElement("tbody");
          const row = document.createElement("tr");

          const th = document.createElement("th");
          th.textContent = labelText;

          const td = document.createElement("td");

          const kvSubClone = document.createElement("div");
          kvSubClone.className = kvSubtable.className || "kv-subtable";

          let contBody = null;
          let contTable = null;

          if (mode === "nested") {
            contTable = sourceTable.cloneNode(false);
            contTable.className = sourceTable.className;
            const thead = sourceTable.querySelector("thead");
            if (thead) {
              contTable.appendChild(thead.cloneNode(true));
            }
            contBody = document.createElement("tbody");
            contTable.appendChild(contBody);
            kvSubClone.appendChild(contTable);
          } else {
            const originalWrapper = sourceTable.closest(".table-horizontal");
            if (!originalWrapper) {
              return null;
            }
            const wrapperClone = originalWrapper.cloneNode(false);
            contTable = sourceTable.cloneNode(false);
            const thead = sourceTable.querySelector("thead");
            if (thead) {
              contTable.appendChild(thead.cloneNode(true));
            }
            contBody = document.createElement("tbody");
            contTable.appendChild(contBody);
            wrapperClone.appendChild(contTable);
            kvSubClone.appendChild(wrapperClone);
          }

          td.appendChild(kvSubClone);

          row.appendChild(th);
          row.appendChild(td);
          outerBody.appendChild(row);
          outerTable.appendChild(outerBody);
          kvTableWrap.appendChild(outerTable);

          const hasCompanyBlock = !!section.querySelector(".company-block");
          if (hasCompanyBlock) {
            const newCompanyBlock = document.createElement("div");
            newCompanyBlock.className = "company-block";
            newCompanyBlock.appendChild(kvTableWrap);
            contSection.appendChild(newCompanyBlock);
          } else {
            contSection.appendChild(kvTableWrap);
          }

          nextPageBody.insertBefore(
            contSection,
            nextPageBody.firstChild || null
          );

          return {
            nextPageBody,
            contSection,
            contBody,
            contTable,
            mode,
          };
        }

        /* ====================== IMPROVED Pagination ====================== */
        function paginateContentImproved() {
          if (debug.enabled) {
            debug.log("paginateContentImproved:start", {
              pages: root.querySelectorAll(".page").length,
            });
          }
          var globalMoves = 0;
          var progress = true;
          var maxGlobalMoves = 2400; // generous guard so very long slips can settle

          while (progress && globalMoves < maxGlobalMoves) {
            progress = false;
            var pages = Array.from(root.querySelectorAll(".page"));
            if (!pages.length) {
              break;
            }

            for (
              var i = 0;
              i < pages.length && globalMoves < maxGlobalMoves;
              i++
            ) {
              var currentPage = pages[i];
              if (!currentPage) continue;

              var pageBody = currentPage.querySelector(".page-body");
              if (!pageBody) continue;

              var pageMoves = 0;
              var maxPageMoves = Math.max(60, pages.length * 18);

              while (
                isPageOverflowing(pageBody) &&
                globalMoves < maxGlobalMoves &&
                pageMoves < maxPageMoves
              ) {
                if (debug.enabled && pageMoves === 0) {
                  debug.log("paginateContentImproved:overflow", {
                    page: i + 1,
                    scroll: Math.ceil(pageBody.scrollHeight),
                    client: Math.floor(pageBody.clientHeight),
                    maxPageMoves: maxPageMoves,
                  });
                }
                var didMove = moveContentToNextPage(currentPage);
                if (!didMove) {
                  if (debug.enabled) {
                    debug.warn("paginateContentImproved: move failed", {
                      page: i + 1,
                      pageMoves: pageMoves,
                      globalMoves: globalMoves,
                    });
                  }
                  break;
                }

                progress = true;
                globalMoves++;
                pageMoves++;

                lockPageBodyHeights();

                pages = Array.from(root.querySelectorAll(".page"));
                pageBody = currentPage.querySelector(".page-body") || pageBody;
              }

              if (debug.enabled && pageMoves > 0) {
                debug.log("paginateContentImproved:page settled", {
                  page: i + 1,
                  pageMoves: pageMoves,
                  globalMoves: globalMoves,
                });
              }
            }
          }

          if (globalMoves >= maxGlobalMoves) {
            console.warn(
              "paginateContentImproved bailed after hitting global move cap",
              maxGlobalMoves
            );
            if (debug.enabled) {
              debug.warn("paginateContentImproved:reached global cap", {
                globalMoves: globalMoves,
                maxGlobalMoves: maxGlobalMoves,
              });
            }
          }

          pruneEmptyPages();
          lockPageBodyHeights();
          updatePageNumbers();
          verifyContentIntegrity();
          if (debug.enabled) {
            debug.renderSummary("paginateContentImproved:complete");
          }
        }
        function pruneEmptyPages() {
          var removed = false;
          var outers = Array.from(root.querySelectorAll(".page-outer"));
          var removedPages = debug.enabled ? [] : null;

          outers.forEach(function (outer) {
            var page = outer.querySelector(".page");
            if (!page) return;

            var body = page.querySelector(".page-body");
            if (!body) return;

            var hasSections = body.querySelector(".section");
            var text = body.textContent ? body.textContent.trim() : "";

            if (!hasSections && text === "") {
              outer.remove();
              removed = true;
              if (removedPages) {
                removedPages.push(
                  Array.prototype.indexOf.call(outers, outer) + 1
                );
              }
            }
          });

          if (removed) {
            lockPageBodyHeights();
            if (removedPages && removedPages.length) {
              debug.log("pruneEmptyPages removed", removedPages);
            }
            if (debug.enabled) {
              debug.renderSummary("after-pruneEmptyPages");
            }
          }

          return removed;
        }
        function sameText(a, b) {
          if (!a || !b) return false;
          const norm = (s) =>
            String(s)
              .replace(/\s+/g, " ")
              .replace(/[:.]+$/, "")
              .trim()
              .toLowerCase();
          return norm(a) === norm(b);
        }
        function verifyContentIntegrity() {
          var allPages = root.querySelectorAll(".page");
          var totalSections = 0;
          var emptyPages = 0;

          allPages.forEach(function (page, index) {
            var pageBody = page.querySelector(".page-body");
            var sections = pageBody
              ? pageBody.querySelectorAll(".section")
              : [];
            totalSections += sections.length;

            if (sections.length === 0) {
              emptyPages++;
              console.warn("Page", index + 1, "is empty!");
            } else {

        function renderLetterTextRows(block, opts) {
          opts = opts || {};
          var onlyValues = !!opts.onlyValues;
          var baseStyle =
            (block.bold ? "font-weight:700;" : "") +
            (block.underline ? "text-decoration:underline;" : "");

          var html = "";
          (block.rows || []).forEach(function (row) {
            var keys = Object.keys(row);
            if (!keys.length) {
              html += '<p style="' + baseStyle + '">&nbsp;</p>';
              return;
            }

            if (onlyValues) {
              var preferred = ["Insurer Name", "Address", "City"];
              preferred.forEach(function (k) {
                if (row.hasOwnProperty(k)) {
                  html +=
                    '<p style="' +
                    baseStyle +
                    '">' +
                    escapeHtml(row[k]) +
                    "</p>";
                }
              });
              keys.forEach(function (k) {
                if (preferred.indexOf(k) === -1) {
                  html +=
                    '<p style="' +
                    baseStyle +
                    '">' +
                    escapeHtml(row[k]) +
                    "</p>";
                }
              });
            } else {
              keys.forEach(function (key) {
                html +=
                  '<p style="' +
                  baseStyle +
                  '"><span style="font-weight:700">' +
                  escapeHtml(key) +
                  ":</span> " +
                  escapeHtml(row[key]) +
                  "</p>";

            }
          });
          return html;

        function getPolicyName(policyBlock) {
          var row =

        function getCompanyName(blocks) {
          if (!blocks) return "";
          var preferred = [
            "Company Name",
            "CompanyName",
            "Insured Name",
            "Insured",
            "Client Name",
          ];
          for (var key in blocks) {
            var b = normalizeBlock(blocks[key]);
            if (!b || !b.rows || !b.rows.length) continue;
            var row = b.rows[0] || {};
            for (var i = 0; i < preferred.length; i++) {
              var k = preferred[i];
              if (row.hasOwnProperty(k) && row[k]) return String(row[k]);
            }
          }
          return "";
        }

        function normalizeBlock(b) {
          if (!b) {
            return { type: "text", bold: false, underline: false, rows: [] };
          }

          var type = (b.dataType || b.Type || "text").toString().toLowerCase();
          var rawRows = Array.isArray(b.sectionData)
            ? b.sectionData
            : Array.isArray(b.data)
            ? b.data
            : [];

          var rows =
            Array.isArray(rawRows) && rawRows.length
              ? rawRows.slice()
              : type === "table"
              ? [{}]
              : [];

          var heading = b.heading != null ? b.heading : b.Heading;
          var subHeading =
            b.subHeading != null ? b.subHeading : b["Sub-heading"];
          var bold = (b.bold || b.Bold) === "Yes";
          var underline = (b.underline || b.Underline) === "Yes";
          var tableType =
            b.tableType ||
            b.TableType ||
            (type === "table" ? "left-right" : null);

          return {
            type: type,
            rows: rows,
            heading: heading,
            subHeading: subHeading,
            bold: bold,
            underline: underline,
            tableType: tableType,
          };
        }

        function isCompanyKey(k) {
          return /^Company/.test(k);
        }

        function alphaLabel(i) {
          return String.fromCharCode("A".charCodeAt(0) + i) + ".";
        }

        function getKolkataTimeIntl() {
          const formatter = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Kolkata",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          });

          const parts = formatter.formatToParts(new Date());
          const formatted = `${parts[0].value}-${parts[2].value}-${parts[4].value}T${parts[6].value}:${parts[8].value}:${parts[10].value}+05:30`;
          return formatted;
        }

          var pages = [{ kind: "a4" }];
          if (Object.keys(schema).some(isCompanyKey)) {
            pages.push({ kind: "company" });

          return {
            title: schema.title || schema.Title || "PLACEMENT SLIP",
            organization: {
              name: "INDIA INSURE RISK MANAGEMENT AND INSURANCE BROKING SERVICES PVT LTD",
              addressLines: [

              ],

          };

        function normalizePayload(source) {
          if (!source) {
            throw new Error("Source payload is required");
          }

          var organization = source.organization || {};
          var pages =
            Array.isArray(source.pages) && source.pages.length
              ? source.pages
              : [{ kind: "a4" }, { kind: "company" }];

          return {
            title: source.title || source.Title || "PLACEMENT SLIP",
            organization: {
              name: organization.name || "",
              addressLines: Array.isArray(organization.addressLines)
                ? organization.addressLines.slice()

                    path: organization.logo.path || "",
                    width: organization.logo.width,
                    height: organization.logo.height,
                  }
                : undefined,
            },
            blocks: source.blocks || source || {},
            pages: pages,
            printedOn:
              source.blocks.FooterSection.printedOn || getKolkataTimeIntl(),
            companyName: source.companyName,
            fileName: source.fileName,

        }

        function createLogoHtml(assets, normalizedPayload) {
          var assetLogo = assets && assets.logo ? assets.logo : undefined;
          var payloadLogo =
            normalizedPayload.organization &&
            normalizedPayload.organization.logo
              ? normalizedPayload.organization.logo
              : undefined;

          var pathSource =
            (assetLogo && assetLogo.path) || (payloadLogo && payloadLogo.path);
          var base64 =
            assetLogo && assetLogo.base64
              ? "data:" +
                (assetLogo.mimeType || "image/jpeg") +
                ";base64," +
                assetLogo.base64
              : null;

          var width =
            (assetLogo && (assetLogo.placementWidth || assetLogo.width)) ||
            (payloadLogo && payloadLogo.width);
          var height =
            (assetLogo && (assetLogo.placementHeight || assetLogo.height)) ||
            (payloadLogo && payloadLogo.height);

          if (pathSource || base64) {
            var src = pathSource || base64;
            return (
              '<img src="' +
              escapeHtml(src) +
              '" alt="Organization logo" ' +
              'style="max-width:' +
              width +
              "px; max-height:" +
              height +
              'px;" ' +
              "onerror=\"this.outerHTML='<div class=&quot;logo-placeholder&quot;>LOGO</div>'\" />"
            );
          }
          return '<div class="logo-placeholder">LOGO</div>';
        }

        function escapeHtml(value) {
          if (value === null || value === undefined) return "";
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function formatPrintedOnLabel(printedOn) {
          if (!printedOn) {
            return new Date().toISOString().slice(0, 16).replace("T", " ");
          }
          var date = new Date(printedOn);
          if (isNaN(date.getTime())) return printedOn;
          var pad = function (v) {
            return String(v).padStart(2, "0");
          };
          return (
            pad(date.getDate()) +
            "-" +
            pad(date.getMonth() + 1) +
            "-" +
            date.getFullYear() +
            " " +
            pad(date.getHours()) +
            ":" +
            pad(date.getMinutes())
          );
        }
